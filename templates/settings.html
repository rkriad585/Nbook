{% extends "base.html" %}

{% block content %}
<div class="w-full h-full overflow-y-auto p-4 md:p-8">
    <div class="max-w-2xl mx-auto space-y-6">
        <h1 class="font-nothing text-4xl text-white tracking-widest">SETTINGS<span class="text-n-red">.</span></h1>

        <!-- System Status -->
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-sm font-bold text-white mb-4 tracking-wide">SYSTEM STATUS</h2>
            <div class="space-y-3" id="settings-status">
                <div class="flex items-center gap-3"><span class="text-xs text-gray-500 w-16">RAM</span>
                    <div class="flex-1 h-2 bg-gray-700 rounded-full overflow-hidden"><div id="settings-ram-bar" class="h-full bg-green-500 w-0 transition-all duration-500"></div></div>
                    <span id="settings-ram-text" class="text-[10px] font-mono text-gray-400">--</span>
                </div>
                <div class="flex items-center gap-3"><span class="text-xs text-gray-500 w-16">DISK</span>
                    <div class="flex-1 h-2 bg-gray-700 rounded-full overflow-hidden"><div id="settings-disk-bar" class="h-full bg-blue-500 w-0 transition-all duration-500"></div></div>
                    <span id="settings-disk-text" class="text-[10px] font-mono text-gray-400">--</span>
                </div>
                <div class="pt-2">
                    <button onclick="settingsRestartKernel()" class="px-4 py-2 bg-n-red/10 text-n-red border border-n-red/20 rounded hover:bg-n-red hover:text-white transition text-xs font-bold">RESTART KERNEL</button>
                </div>
            </div>
        </div>

        <!-- Theme Settings -->
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-sm font-bold text-white mb-4 tracking-wide">THEME</h2>
            <button onclick="toggleTheme()" id="settings-theme-btn" class="px-4 py-2 bg-white/5 text-gray-400 border border-white/10 rounded hover:bg-white/10 hover:text-white transition text-xs font-bold">DARK MODE</button>
        </div>

        <!-- CodeMirror Theme -->
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-sm font-bold text-white mb-4 tracking-wide">EDITOR THEME</h2>
            <select id="settings-cm-theme" onchange="setGlobalCMTheme(this.value)" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500/50">
                <option value="material-palenight">Palenight (Dark)</option>
                <option value="darcula">Darcula</option>
                <option value="monokai">Monokai</option>
                <option value="solarized dark">Solarized</option>
                <option value="default">Light (Default)</option>
            </select>
        </div>

        <!-- Project Export -->
        <div class="glass-panel rounded-2xl p-6">
            <h2 class="text-sm font-bold text-white mb-4 tracking-wide">EXPORT PROJECT</h2>
            <select id="settings-project-select" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500/50">
                <option value="">-- Select a saved project --</option>
                {% for nb in notebooks %}
                <option value="{{ nb.id }}">{{ nb.title }} (ID: {{ nb.id }})</option>
                {% endfor %}
            </select>
            <div class="flex gap-2 mt-4">
                <button onclick="settingsExport('json')" class="flex-1 py-2 bg-n-red/10 text-n-red border border-n-red/20 rounded hover:bg-n-red hover:text-white transition text-xs font-bold">JSON</button>
                <button onclick="settingsExport('html')" class="flex-1 py-2 bg-purple-500/10 text-purple-400 border border-purple-500/20 rounded hover:bg-purple-500 hover:text-white transition text-xs font-bold">HTML</button>
                <button onclick="settingsExport('pdf')" class="flex-1 py-2 bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded hover:bg-rose-500 hover:text-white transition text-xs font-bold">PDF</button>
            </div>
        </div>

        <!-- Nav -->
        <div class="flex gap-2">
            <a href="/" class="flex-1 text-center py-2 bg-white/5 text-gray-400 border border-white/10 rounded hover:bg-white/10 hover:text-white transition text-xs font-bold">EDITOR</a>
            <a href="/auth/profile" class="flex-1 text-center py-2 bg-white/5 text-gray-400 border border-white/10 rounded hover:bg-white/10 hover:text-white transition text-xs font-bold">PROFILE</a>
        </div>
    </div>
</div>

<script>
let settingsTheme = localStorage.getItem('nbook-theme') || 'dark';
let settingsCMTheme = localStorage.getItem('nbook-cm-theme') || 'material-palenight';

$(document).ready(() => {
    $('#settings-cm-theme').val(settingsCMTheme);
    $('#settings-theme-btn').text(settingsTheme === 'dark' ? 'DARK MODE' : 'LIGHT MODE');
    loadSettingsStatus();
    setInterval(loadSettingsStatus, 5000);
});

function loadSettingsStatus() {
    $.get('/system/stats', (d) => {
        $('#settings-ram-bar').css('width', (d.ram.percent||0)+'%');
        $('#settings-disk-bar').css('width', (d.disk.percent||0)+'%');
        $('#settings-ram-text').text(`${d.ram.percent||0}% (${d.ram.used||'?'}/${d.ram.total||'?'} GB)`);
        $('#settings-disk-text').text(`${d.disk.percent||0}% (${d.disk.used||'?'}/${d.disk.total||'?'} GB)`);
    });
}

function toggleTheme() {
    settingsTheme = settingsTheme === 'dark' ? 'light' : 'dark';
    localStorage.setItem('nbook-theme', settingsTheme);
    document.documentElement.className = settingsTheme;
    $('#settings-theme-btn').text(settingsTheme === 'dark' ? 'DARK MODE' : 'LIGHT MODE');
}

function setGlobalCMTheme(theme) {
    settingsCMTheme = theme;
    localStorage.setItem('nbook-cm-theme', theme);
}

function settingsRestartKernel() {
    if(!confirm('Restart kernel? All variables will be cleared.')) return;
    $.post('/system/restart', () => alert('Kernel restarted'));
}

function settingsExport(fmt) {
    const id = $('#settings-project-select').val();
    if(!id) return alert('Select a project first');
    $.get(`/history/load/${id}`, (data) => {
        const cells = data.cells || JSON.parse(data.content || '[]');
        const payload = {title: data.title, cells};
        if(fmt === 'json') {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'}));
            a.download = `${data.title}.json`; a.click();
        } else {
            $.ajax({
                url: `/export/${fmt}`, type: 'POST', contentType: 'application/json',
                data: JSON.stringify(payload),
                xhrFields: { responseType: 'blob' },
                success: (blob) => {
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `${data.title}.${fmt}`; a.click();
                },
                error: (e) => { try { const r = JSON.parse(e.responseText); alert(r.error || 'Export failed'); } catch(_) { alert('Export failed'); } }
            });
        }
    });
}
</script>
{% endblock %}
