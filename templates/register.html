{% extends "base.html" %}

{% block content %}
<div class="w-full h-full flex items-center justify-center">
    <div class="glass-panel rounded-2xl p-8 w-full max-w-sm mx-4">
        <h1 class="font-nothing text-3xl text-white tracking-widest text-center mb-8">REGISTER<span class="text-n-red">.</span></h1>
        <form id="register-form" class="space-y-4" onsubmit="return doRegister(event)">
            <div>
                <label class="text-xs text-gray-500 font-mono block mb-1">USERNAME</label>
                <input type="text" id="reg-username" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500/50">
            </div>
            <div>
                <label class="text-xs text-gray-500 font-mono block mb-1">PASSWORD</label>
                <input type="password" id="reg-password" required class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500/50">
            </div>
            <div id="reg-error" class="text-xs text-n-red hidden"></div>
            <button type="submit" class="w-full py-2.5 bg-green-500/20 text-green-400 border border-green-500/30 rounded-lg hover:bg-green-500/40 transition text-sm font-bold">REGISTER</button>
        </form>
        <p class="text-xs text-gray-500 text-center mt-6">Already have an account? <a href="/auth/login" class="text-blue-400 hover:text-blue-300">Login</a></p>
        <p class="text-xs text-gray-500 text-center mt-2"><a href="/" class="text-gray-600 hover:text-gray-400">Back to editor</a></p>
    </div>
</div>

<script>
function doRegister(e) {
    e.preventDefault();
    const username = $('#reg-username').val();
    const password = $('#reg-password').val();
    $.ajax({
        url: '/auth/register', type: 'POST', contentType: 'application/json',
        data: JSON.stringify({username, password}),
        success: (res) => { window.location.href = '/'; },
        error: (e) => { $('#reg-error').text(e.responseJSON?.error || 'Registration failed').removeClass('hidden'); }
    });
    return false;
}
</script>
{% endblock %}
